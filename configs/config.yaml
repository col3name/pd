# version2/configs/config.yaml
port: 8080
allow_unmask: true
log_file: "/srv/logs/pii-gateway.log"   # путь для логов (скачивание в админке); пусто = только stderr
queue:
  workers: 16
  fast_capacity: 1024
  heavy_capacity: 256
  heavy_threshold: 4096

store:
  type: layered          # "memory" | "redis" | "layered"
  ttl_hours: 24
  capacity: 262144
  redis_url: "redis://localhost:6379/0"
  circuit:
    failures: 5
    cooldown_seconds: 5

autoscale:
  min_replicas: 2
  max_replicas: 20
  cpu_up: 70
  cpu_down: 30
  queue_up: 100
  latency_p99_ms: 100
  cooldown_seconds: 30
  poll_seconds: 10
masking:
  mode: redact          # "redact" | "token"
context:
  enabled: true
  boost:
    "ФИО": [клиент, заёмщик, паспорт, держатель, анкета, указал]
    "АДРЕС": [адрес клиента, проживает, зарегистрирован]
  penalty:
    "АДРЕС": [отделение, офис, банк]
    "ФИО": [поэт, писатель, написал]
whitelist:
  enabled: true
  persons: [Александр Пушкин, Лев Толстой, Антон Чехов]
  addresses: [Красная площадь, отделение Альфа-Банка]
  organizations: [Альфа-Банк]
resolve:
  priority:
    "КАРТА": 100
    "ПАСПОРТ": 95
    "ИНН": 40
ml:
  enabled: false            # NER: https://github.com/yalue/onnxruntime_go
  model_path: "/srv/models/ner/model.onnx"   # rubert-tiny ONNX-модель (scripts/setup_ner.sh)
  vocab_path: "/srv/models/ner/vocab.txt"
  labels: [O, B-PER, I-PER, B-LOC, I-LOC, B-ORG, I-ORG]
sensitive:
  - ПИН
  - CVV
rate_limit:
  rps: 0
  burst: 0

# Системы-потребители: per-system типы ПД, режим маски и право на демаскирование.
# system="" (или не известное имя) -> поведение по умолчанию (глобальные настройки).
systems:
  - name: chat
    api_key: "demo-chat-key"
    enabled: true
    pii: [ФИО, ПАСПОРТ, ТЕЛЕФОН, EMAIL, КАРТА, ИНН, ДАТА]  # пусто = все типы
    masking: token          # "redact" | "token"; пусто = глобальный mode
    allow_unmask: true
  - name: analytics
    api_key: "demo-analytics-key"
    enabled: true
    pii: [ТЕЛЕФОН, EMAIL]   # аналитике недоступны ФИО/паспорт/карты
    masking: redact
    allow_unmask: false     # аналитике запрещено демаскирование
  - name: external_llm
    api_key: "demo-llm-key"
    enabled: true
    pii: []                 # пусто = маскировать все типы
    masking: token
    allow_unmask: false
  - name: disabled_system
    enabled: false
    allow_unmask: false

database:
  dsn: "postgres://pii:pii@localhost:5432/pii?sslmode=disable"

admin:
  login: "admin"
  password: "admin123"

# Правила расширения (overlay): новые типы ПДН без переписывания ядра.
# Требуют: type (имя), regex (go RE2) или capture (значение в group 1).
rules:
  - type: "СНИЛС"
    regex: "\\d{3}-\\d{3}-\\d{3}\\s\\d{2}"
    priority: 0
    confidence: 0.99

# Комбинации: тип маскируется только при наличии требуемых типов рядом.
# Раскомментируйте, чтобы ПИН маскировался только рядом с картой.
# combinations:
#   - type: "ПИН"
#     requires: ["КАРТА"]
#     window: 80
