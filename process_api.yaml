openapi: 3.0.3
info:
  title: Модуль безопасности ПД — контракт /process
  version: "1.0.0"
  description: |
    Единый контракт, который команды-участники ДОЛЖНЫ реализовать на своём сервисе.
    Система проверки AlfaSonar обращается к этому эндпоинту для нагрузочного тестирования
    и оценки точности маскирования/демаскирования персональных данных.

    ВАЖНО (логика проверки одинакова для всех команд):
    * Эндпоинт один — `POST /process`. Он обрабатывает и маскирование, и демаскирование.
    * Проверка идёт парами по каждому элементу датасета и коррелируется полем `payload_id`:
      1) ПРЯМАЯ проверка (маскирование): приходит первый запрос с новым `payload_id`,
         `payload` = исходная строка. Сервис ДОЛЖЕН вернуть замаскированную строку и
         запомнить соответствие по `payload_id`.
      2) ОБРАТНАЯ проверка (демаскирование): приходит второй запрос с ТЕМ ЖЕ `payload_id`,
         `payload` = ранее возвращённая вами замаскированная строка. Сервис ДОЛЖЕН вернуть
         исходную (демаскированную) строку.
    * `payload_id` уникален для каждого элемента в рамках прогона — используйте его как ключ
      корреляции «маскирование → демаскирование».
    * Ответ всегда: `{"result": "<строка>"}`.

    Дополнительно (расширения решения, не влияющие на контракт):
    * Поле `system` и заголовок `X-API-Key` — необязательные: включают настройки конкретной
      системы-потребителя (список типов ПД, режим маски, право демаскирования).
      Проверяющая система их не передаёт — работает глобальный конфиг.
servers:
  - url: /
    description: Текущий хост (удобно для «Try it out» на этой странице)
  - url: https://your-solution.example.com
    description: HTTPS (self-signed допускается — проверка идёт с ssl_verify=false)
  - url: http://your-solution.example.com
    description: HTTP также поддерживается
paths:
  /process:
    post:
      operationId: process
      summary: Маскирование/демаскирование строки (коррелируется по payload_id)
      description: |
        Первый запрос с новым `payload_id` маскирует строку; повторный запрос с тем же
        `payload_id` возвращает исходную строку байт-в-байт (демаскирование).
        Эндпоинт идемпотентен по `payload_id` — безопасен к ретраям нагрузки:
        повтор того же payload (исходная строка) возвращает ту же маску, а повтор
        payload-маски возвращает оригинал.
      parameters:
        - name: X-API-Key
          in: header
          required: false
          description: |
            API-ключ системы-потребителя. Нужен только если в запросе указан `system`,
            у которого в конфиге задан `api_key`. Проверяющая система не передаёт заголовок.
          schema:
            type: string
            example: demo-chat-key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessRequest"
            examples:
              mask:
                summary: Прямая проверка — маскирование (новый payload_id)
                value:
                  payload: "Клиент Иванов Иван Иванович, паспорт 4509 123456"
                  payload_id: "8a77d363c7c044b49b41d7b8a448243a"
              unmask:
                summary: Обратная проверка — демаскирование (тот же payload_id)
                value:
                  payload: "Клиент [ФИО], паспорт [ПАСПОРТ]"
                  payload_id: "8a77d363c7c044b49b41d7b8a448243a"
              system:
                summary: Запрос от конкретной системы-потребителя (с заголовком X-API-Key)
                value:
                  payload: "Клиент Иванов Иван, тел +7 912 345-67-89"
                  payload_id: "chat-1"
                  system: "chat"
      responses:
        "200":
          description: Успешная обработка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessResponse"
              examples:
                masked:
                  summary: Результат маскирования
                  value:
                    result: "Клиент [ФИО], паспорт [ПАСПОРТ]"
                unmasked:
                  summary: Результат демаскирования (исходная строка)
                  value:
                    result: "Клиент Иванов Иван Иванович, паспорт 4509 123456"
        "400":
          description: Нет payload_id, битый JSON или некорректный payload
        "401":
          description: Неверный или отсутствующий X-API-Key для указанной системы
        "403":
          description: "Система-потребитель отключена (enabled: false)"
        "404":
          description: Неизвестная система-потребителя (поле system)
        "429":
          description: |
            Слишком много запросов. Допустимо под нагрузкой. Проверяющая система применит
            ожидание и ретраи; если 429 не проходит — это значимый результат (решение не держит нагрузку).
        "4XX":
          description: Ошибка запроса
        "5XX":
          description: Внутренняя ошибка сервиса
components:
  schemas:
    ProcessRequest:
      type: object
      required: [payload, payload_id]
      properties:
        payload:
          type: string
          description: |
            Строка для обработки. На прямом шаге — исходный текст с ПД; на обратном шаге —
            ваша же ранее возвращённая замаскированная строка (тот же payload_id).
          example: "Клиент Иванов Иван Иванович, паспорт 4509 123456"
        payload_id:
          type: string
          description: Идентификатор корреляции. Один и тот же для пары маскирование→демаскирование.
          example: "8a77d363c7c044b49b41d7b8a448243a"
        system:
          type: string
          description: |
            Необязательное поле: имя системы-потребителя из конфига (список типов ПД,
            режим маски, право демаскирования, API-ключ). Если не указано — глобальные настройки.
          example: "chat"
    ProcessResponse:
      type: object
      required: [result]
      properties:
        result:
          type: string
          description: |
            Результат обработки (замаскированная строка на прямом шаге, исходная — на обратном).
          example: "Клиент [ФИО], паспорт [ПАСПОРТ]"
