name: Deploy to server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 5.42.118.103
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/pd
            git fetch origin main
            git reset --hard origin/main
            # Download NER model + vocab + ONNX Runtime (idempotent)
            ./scripts/setup_ner.sh --skip-runtime || true
            # Build with NER enabled and start with the NER config
            WITH_NER=1 CONFIG_FILE=./configs/config.ner.yaml docker compose up -d --build
            sleep 3
            curl -sf http://localhost:5173/health || exit 1