# version2/docker-compose.yml
# Default: pii-module-v2 runs with in-memory store, no Redis required.
# To enable Redis mode, mount a config that sets store.type=redis and
# store.redis_url (redis_url has no env override), then run with the redis
# profile:
#
#   docker compose --profile redis up -d --build
#
# Example override for Redis:
#   docker compose run --rm -e STORE=redis \
#     -v ./configs/config.redis.yaml:/srv/configs/config.yaml:ro pii-module-v2
services:
  pii-module-v2:
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pii
      POSTGRES_PASSWORD: pii
      POSTGRES_DB: pii
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["redis"]

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  admin:
    build: ./web
    ports:
      - "5173:80"
    depends_on:
      - pii-module-v2
    restart: unless-stopped

volumes:
  pgdata: